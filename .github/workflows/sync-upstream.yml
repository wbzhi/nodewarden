name: Sync Fork Upstream
on:
  schedule:
    - cron: '0 0 * * *' # UTC0点，北京时间早8点自动同步
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fork Sync
        uses: tgymnich/fork-sync@v2
        with:
          owner: wbzhi
          repo: nodewarden
          upstream: shuaiplus/nodewarden
          branch: main
          force: true
